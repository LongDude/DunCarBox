apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - DUNCARBOX_DATABASE_URL=postgresql://db:5432
      - DUNCARBOX_DEMO_DIR=/app/demo
      # The frontend and API share the same origin through nginx.
      - DUNCARBOX_CORS_ORIGINS=
