apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: duncarbox

resources:
  - namespace.yaml
  - ../../../backend/.tofu
  - ../../../frontend/.tofu
  - ../../postgres/.tofu
  - ingress.yaml

patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
