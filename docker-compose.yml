name: duncarbox

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duncarbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duncarbox}
      POSTGRES_DB: ${POSTGRES_DB:-duncarbox}
    ports:
      - "127.0.0.1:${DUNCARBOX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DUNCARBOX_DATABASE_URL: postgresql://db:5432
      PGUSER: ${POSTGRES_USER:-duncarbox}
      PGPASSWORD: ${POSTGRES_PASSWORD:-duncarbox}
      PGDATABASE: ${POSTGRES_DB:-duncarbox}
      DUNCARBOX_DEMO_DIR: /app/demo
      DUNCARBOX_CORS_ORIGINS: ${DUNCARBOX_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${DUNCARBOX_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${DUNCARBOX_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
